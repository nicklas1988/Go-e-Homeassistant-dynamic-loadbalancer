alias: Dynamisk strömbegränsare Go-e v5
description: Dynamisk strömbegränsning + paus för go-eCharger
triggers:
  - trigger: state
    entity_id:
      - sensor.current_phase_1
      - sensor.current_phase_2
      - sensor.current_phase_3
    for: "00:00:03"
  - trigger: time_pattern
    seconds: /10
conditions: []
actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ can_pause }}"
        sequence:
          - action: select.select_option
            target:
              entity_id: "{{ frc_select_entity }}"
            data:
              option: "{{ frc_dont_charge_option }}"
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ auto_pause_entity }}"
          - action: logbook.log
            data:
              name: EV control
              entity_id: "{{ amp_number_entity }}"
              message: >-
                PAUSAR laddning (max fas {{ house_max_a|round(1) }} A ≥ {{
                pause_threshold_a }} A).
      - conditions:
          - condition: template
            value_template: "{{ can_emergency_reduce }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: "{{ amp_number_entity }}"
            data:
              value: "{{ safe_setpoint_a }}"
          - if:
              - condition: template
                value_template: "{{ overload_start_is_stale }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: "{{ overload_start_entity }}"
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: logbook.log
            data:
              name: EV control
              entity_id: "{{ amp_number_entity }}"
              message: >-
                NÖDSÄNK till {{ safe_setpoint_a }} A (max fas
                {{ house_max_a|round(1) }} A ≥ {{ pause_threshold_a }} A).
      - conditions:
          - condition: template
            value_template: "{{ can_resume }}"
        sequence:
          - action: select.select_option
            target:
              entity_id: "{{ frc_select_entity }}"
            data:
              option: "{{ frc_neutral_option }}"
          - delay: "00:00:03"
          - action: number.set_value
            target:
              entity_id: "{{ amp_number_entity }}"
            data:
              value: "{{ min_ev_a }}"
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ auto_pause_entity }}"
          - action: logbook.log
            data:
              name: EV control
              entity_id: "{{ amp_number_entity }}"
              message: >-
                ÅTERUPPTAR laddning (auto). Max fas {{ house_max_a|round(1) }} A
                ≤ {{ resume_threshold_a }} A.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ should_decrease }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: "{{ amp_number_entity }}"
            data:
              value: "{{ next_setpoint_a_raw }}"
          - action: logbook.log
            data:
              name: EV limit
              entity_id: "{{ amp_number_entity }}"
              message: >-
                SÄNK till {{ next_setpoint_a_raw }} A (hus max {{
                house_max_a|round(1) }} A).
      - conditions:
          - condition: template
            value_template: "{{ should_increase }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: "{{ amp_number_entity }}"
            data:
              value: "{{ next_setpoint_a_raw }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ last_raise_entity }}"
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: logbook.log
            data:
              name: EV limit
              entity_id: "{{ amp_number_entity }}"
              message: >-
                HÖJ till {{ next_setpoint_a_raw }} A (hus max {{
                house_max_a|round(2) }} A, Δt_last_raise={{
                seconds_since_last_raise|int }} s, rate-limit={{
                increase_rate_limit_s }} s).
mode: restart
variables:
  # Constants
  fuse_a: 20
  safety_margin_a: 3
  min_ev_a: 6
  max_ev_a: 10
  step_a: 1
  increase_buffer_a: 2
  resume_buffer_a: 2
  resume_cooldown_s: 600
  increase_rate_limit_s: 15
  overload_timeout_s: 20

  # Entities
  amp_number_entity: number.go_echarger_xxxxxx_amp
  frc_select_entity: select.go_echarger_xxxxxx_frc
  car_state_sensor: sensor.go_echarger_xxxxxx_car
  auto_pause_entity: input_boolean.go_e_auto_paused
  last_raise_entity: input_datetime.go_e_last_raise
  overload_start_entity: input_datetime.go_e_overload_start
  phase_1_sensor: sensor.current_phase_1
  phase_2_sensor: sensor.current_phase_2
  phase_3_sensor: sensor.current_phase_3

  # FRC strings
  frc_dont_charge_state: "don't charge"
  frc_dont_charge_option: "Don't charge"
  frc_neutral_option: "Neutral"

  # Thresholds
  reduce_threshold_a: "{{ fuse_a - safety_margin_a }}"
  pause_threshold_a: "{{ fuse_a }}"
  resume_threshold_a: "{{ fuse_a - min_ev_a - resume_buffer_a }}"

  # Measurements
  phase_1_state: "{{ states(phase_1_sensor) }}"
  phase_2_state: "{{ states(phase_2_sensor) }}"
  phase_3_state: "{{ states(phase_3_sensor) }}"
  house_sensors_ok: >-
    {{ phase_1_state not in ['unknown','unavailable','none',''] and
       phase_2_state not in ['unknown','unavailable','none',''] and
       phase_3_state not in ['unknown','unavailable','none',''] }}
  house_max_a: >-
    {% set l1 = states(phase_1_sensor) | float(0) %}
    {% set l2 = states(phase_2_sensor) | float(0) %}
    {% set l3 = states(phase_3_sensor) | float(0) %}
    {{ [l1, l2, l3] | max }}
  house_max_a_f: "{{ house_max_a | float(0) }}"
  frc_state: "{{ states(frc_select_entity) | lower }}"
  car_state: "{{ states(car_state_sensor) | lower }}"
  is_charging: "{{ car_state in ['charging'] }}"
  is_connected: "{{ car_state in ['connected','charging'] }}"
  is_paused: "{{ frc_state == frc_dont_charge_state }}"
  is_not_paused: "{{ not is_paused }}"
  is_auto_paused: "{{ is_state(auto_pause_entity, 'on') }}"
  current_setpoint_a: "{{ states(amp_number_entity) | float(min_ev_a) }}"

  # Timers
  seconds_since_auto_pause: >-
    {% if auto_pause_entity in states and is_auto_paused %}
      {{ (as_timestamp(now()) - as_timestamp(states[auto_pause_entity].last_changed)) | float(0) }}
    {% else %}
      999999
    {% endif %}
  seconds_since_last_raise: >-
    {% set s = states(last_raise_entity) %}
    {% if s in ['unknown','unavailable','none',''] %}
      999999
    {% else %}
      {% set t = strptime(s, '%Y-%m-%d %H:%M:%S') %}
      {{ (as_timestamp(now()) - as_timestamp(t)) | float(0) }}
    {% endif %}

  # Overload detection
  is_overloaded: "{{ house_max_a_f >= (pause_threshold_a | float(0)) }}"
  excess_a: "{{ [house_max_a_f - (reduce_threshold_a | float(0)), 0] | max }}"
  safe_setpoint_a: "{{ [((current_setpoint_a | float) - (excess_a | float)) | int, min_ev_a | int] | max }}"
  seconds_since_overload_start: >-
    {% set s = states(overload_start_entity) %}
    {% if s in ['unknown','unavailable','none',''] %}
      999999
    {% else %}
      {% set t = strptime(s, '%Y-%m-%d %H:%M:%S') %}
      {{ (as_timestamp(now()) - as_timestamp(t)) | float(0) }}
    {% endif %}
  overload_start_is_stale: >-
    {{ (seconds_since_overload_start | float(999999)) > ((overload_timeout_s | float(20)) + 10) }}
  overload_timed_out: >-
    {{ is_overloaded and not overload_start_is_stale and
       (seconds_since_overload_start | float(0)) >= (overload_timeout_s | float(20)) }}

  # Setpoint selection
  next_setpoint_a_raw: >-
    {% set over_down = house_max_a > (reduce_threshold_a | float(0)) %}
    {% set under_up = house_max_a < ((reduce_threshold_a | float(0)) - (increase_buffer_a | float(0))) %}
    {% if over_down %}
      {{ [current_setpoint_a - step_a, min_ev_a] | max | int }}
    {% elif under_up %}
      {{ [current_setpoint_a + step_a, max_ev_a] | min | int }}
    {% else %}
      {{ current_setpoint_a | int }}
    {% endif %}

  # Action guards (single source of truth for conditions)
  can_pause: >-
    {{ house_sensors_ok and is_connected and is_not_paused and
       is_overloaded and
       ((safe_setpoint_a | int) < (min_ev_a | int) or
        overload_timed_out or
        ((current_setpoint_a | int) <= (min_ev_a | int) and is_overloaded)) }}
  can_emergency_reduce: >-
    {{ house_sensors_ok and is_connected and is_not_paused and
       is_overloaded and
       ((safe_setpoint_a | int) >= (min_ev_a | int)) and
       ((current_setpoint_a | int) > (min_ev_a | int)) and
       not overload_timed_out }}
  can_resume: >-
    {{ house_sensors_ok and is_paused and is_auto_paused and
       (house_max_a_f <= (resume_threshold_a | float(0))) and
       (seconds_since_auto_pause >= (resume_cooldown_s | float(0))) }}
  should_decrease: >-
    {{ house_sensors_ok and is_not_paused and is_charging and
       not is_overloaded and
       ((next_setpoint_a_raw | int) < (current_setpoint_a | int)) }}
  should_increase: >-
    {{ house_sensors_ok and is_not_paused and is_charging and
       ((next_setpoint_a_raw | int) > (current_setpoint_a | int)) and
       (house_max_a_f <= ((reduce_threshold_a | float(0)) - (increase_buffer_a | float(0)))) and
       (seconds_since_last_raise >= (increase_rate_limit_s | float(0))) }}
